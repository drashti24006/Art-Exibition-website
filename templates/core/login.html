{% extends 'base.html' %}

{% block title %}Login - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-art border-0 shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="font-display text-center mb-4">Login</h2>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <input type="hidden" name="next" value="{{ request.GET.next }}">
                            <button type="submit" class="btn btn-art w-100">Login</button>
                        </form>
                        <p class="text-center mt-3 mb-0">Don't have an account? <a href="{% url 'core:register' %}">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
