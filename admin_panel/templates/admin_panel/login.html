{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Art Exhibition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card" style="width: 360px;">
        <div class="card-body p-4">
            <h4 class="text-center mb-4">Admin Login</h4>
            <p class="text-muted small text-center mb-3"></p>
            {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">Email</label>{{ form.email }}</div>
                <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
                <button type="submit" class="btn btn-dark w-100">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
