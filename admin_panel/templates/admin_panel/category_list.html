{% extends 'admin_panel/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Categories</h2>
    <form class="d-flex gap-2" method="post" action="{% url 'admin_panel:category_add' %}">
        {% csrf_token %}
        <input type="text" name="name" class="form-control form-control-sm" placeholder="New category name" required>
        <button type="submit" class="btn btn-sm btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Add
        </button>
    </form>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Slug</th>
                        <th>Paintings</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in categories %}
                    <tr>
                        <td>{{ c.name }}</td>
                        <td><span class="badge bg-light text-muted">{{ c.slug }}</span></td>
                        <td>{{ c.painting_count }}</td>
                        <td class="text-end">
                            <form method="post" action="{% url 'admin_panel:category_delete' c.id %}" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete category {{ c.name }}?');">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center text-muted">No categories.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
