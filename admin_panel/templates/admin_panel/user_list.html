{% extends 'admin_panel/base.html' %}

{% block content %}
<h2 class="mb-4">Users</h2>
<div class="table-responsive">
    <table class="table table-hover">
        <thead><tr><th>Email</th><th>Username</th><th>Joined</th></tr></thead>
        <tbody>
            {% for u in users %}
            <tr><td>{{ u.email }}</td><td>{{ u.username }}</td><td>{{ u.date_joined|date:"d M Y" }}</td></tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted">No users.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
